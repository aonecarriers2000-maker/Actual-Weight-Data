<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWB Document Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #ffffff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="date"], input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 5px; }
        .scan-btn { background-color: #28a745; }
        .cam-btn { background-color: #17a2b8; }
        #preview-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .img-preview { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; }
        
        /* Camera Modal Setup */
        #camera-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1000; flex-direction:column; align-items:center; justify-content:center; }
        #video-container { position: relative; width: 90%; max-width: 400px; }
        #video-feed { width: 100%; border-radius: 8px; display: block; }
        
        /* Flash Screen Animation */
        #flash-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: white; opacity: 0; pointer-events: none; border-radius: 8px;
            transition: opacity 0.15s ease-out;
        }
        .flash-active { opacity: 0.8 !important; }

        /* On-Screen Status inside Camera */
        .cam-status {
            color: #ffffff; font-size: 16px; margin-top: 10px; font-weight: bold;
            display: flex; align-items: center; gap: 10px;
        }
        #mini-thumb { width: 40px; height: 40px; border-radius: 4px; border: 1px solid #fff; display: none; object-fit: cover; }
    </style>
</head>
<body>

<div class="container">
    <h2>AWB Scanner App</h2>
    <form id="appForm">
        <div class="form-group">
            <label for="entryDate">Select Date:</label>
            <input type="date" id="entryDate" required>
        </div>

        <div class="form-group">
            <label for="awbNumber">Air Way Bill (AWB) Number:</label>
            <input type="text" id="awbNumber" placeholder="Enter or Scan AWB Number" required>
            <button type="button" class="scan-btn" onclick="startBarcodeScanner()">Scan Barcode</button>
            <div id="reader"></div>
        </div>

        <div class="form-group">
            <label>Take Photos (Captured: <span id="photoCount">0</span>):</label>
            <button type="button" class="cam-btn" onclick="openCamera()">📸 Open Camera & Take Photo</button>
            <div id="preview-container"></div>
        </div>

        <button type="submit" id="submitBtn">Save to Drive</button>
    </form>
</div>

<!-- Camera Overlay Modal -->
<div id="camera-modal">
    <div id="video-container">
        <video id="video-feed" autoplay playsinline></video>
        <div id="flash-overlay"></div>
    </div>

    <!-- On-screen Live Counter and Last Capture Thumbnail -->
    <div class="cam-status">
        <img id="mini-thumb" alt="Last capture">
        <span>Photos Clicked: <span id="modalPhotoCount">0</span></span>
    </div>

    <div style="margin-top: 15px; display: flex; gap: 10px;">
        <button type="button" style="width: auto; padding: 12px 24px; background: #28a745;" onclick="capturePhoto()">Click Photo</button>
        <button type="button" style="width: auto; padding: 12px 24px; background: #dc3545;" onclick="closeCamera()">Done / Close</button>
    </div>
</div>

<script>
    // 🔴 APNA GOOGLE APPS SCRIPT WEB APP URL YAHAN QUOTE (" ") KE ANDAR PASTE KAREIN:
    const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

    document.getElementById('entryDate').valueAsDate = new Date();
    let capturedPhotos = [];
    let mediaStream = null;

    function startBarcodeScanner() {
        const html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 150 } },
            (decodedText) => {
                document.getElementById('awbNumber').value = decodedText;
                html5QrcodeScanner.stop();
                document.getElementById('reader').innerHTML = "";
            },
            () => {}
        );
    }

    async function openCamera() {
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            document.getElementById('video-feed').srcObject = mediaStream;
            document.getElementById('camera-modal').style.display = 'flex';
        } catch (err) {
            alert("Camera Access Error: " + err);
        }
    }

    function capturePhoto() {
        const video = document.getElementById('video-feed');
        const flash = document.getElementById('flash-overlay');
        
        flash.classList.add('flash-active');
        setTimeout(() => flash.classList.remove('flash-active'), 150);

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        capturedPhotos.push({ mimeType: "image/jpeg", data: dataUrl });

        document.getElementById('modalPhotoCount').innerText = capturedPhotos.length;
        const miniThumb = document.getElementById('mini-thumb');
        miniThumb.src = dataUrl;
        miniThumb.style.display = 'block';

        const img = document.createElement('img');
        img.src = dataUrl;
        img.className = 'img-preview';
        document.getElementById('preview-container').appendChild(img);
        document.getElementById('photoCount').innerText = capturedPhotos.length;
    }

    function closeCamera() {
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
        }
        document.getElementById('camera-modal').style.display = 'none';
    }

    document.getElementById('appForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        if (capturedPhotos.length === 0) {
            alert("Please capture at least one photo.");
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "Saving to Drive...";

        const payload = {
            date: document.getElementById('entryDate').value,
            awb: document.getElementById('awbNumber').value,
            files: capturedPhotos
        };

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
                body: JSON.stringify(payload)
            });
            
            const result = await response.json();
            
            if (result.status === "success") {
                alert("Data Drive mein successfully save ho gaya!");
                capturedPhotos = [];
                document.getElementById('preview-container').innerHTML = "";
                document.getElementById('photoCount').innerText = "0";
                document.getElementById('modalPhotoCount').innerText = "0";
                document.getElementById('mini-thumb').style.display = 'none';
                document.getElementById('awbNumber').value = "";
            } else {
                alert("Error: " + result.message);
            }
        } catch (err) {
            alert("Photos process ho gayi hain! Google Drive check karein.");
            capturedPhotos = [];
            document.getElementById('preview-container').innerHTML = "";
            document.getElementById('photoCount').innerText = "0";
            document.getElementById('modalPhotoCount').innerText = "0";
            document.getElementById('mini-thumb').style.display = 'none';
            document.getElementById('awbNumber').value = "";
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Save to Drive";
        }
    });
</script>

</body>
</html>
